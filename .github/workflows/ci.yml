# dist/ is committed on purpose (see .gitignore): consumers install this package from a
# git tag, where no build step ever runs. That trades a build for a staleness risk — a tag
# cut from a commit whose dist/ lags its src/ ships a silently wrong binary. This job is
# the guard: rebuild, and fail if the committed output differs from what src/ produces.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: dist is current, tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # node runs the test suite (node:test over .mjs files)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile
      - run: bun run build

      # porcelain, not `git diff`: a NEW src file emits an untracked dist file that
      # `git diff` never sees, and the tag would ship without it.
      - name: committed dist/ matches a fresh build
        run: |
          test -z "$(git status --porcelain -- dist)" \
            || { git status --porcelain -- dist; echo "::error::dist/ is stale — run 'bun run build' and commit the result"; exit 1; }

      - run: node --test "test/*.test.mjs"
